<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Media Queries Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: white;
      margin: 0;
      padding: 20px;
    }

    .container {
      display: flex;
      gap: 20px;
    }

    .box {
      flex: 1;
      padding: 20px;
      background-color: lightblue;
      text-align: center;
      border: 2px solid black;
    }
    h1 {
      color: darkblue;
      text-align: center;
    }
    @media screen and (max-width: 768px) {
      body {
        background-color: lightyellow;
      }
      .container {
        flex-direction: column;
      }
      .box {
        background-color: lightgreen;
      }
      h1 {
        color: darkgreen;
      }
    }
    @media screen and (max-width: 480px) {

      body {
        background-color: lightpink;
      }

      .box {
        font-size: 14px;
        padding: 10px;
        background-color: coral;
      }
      h1 {
        font-size: 24px;
        color: white;
        background-color: black;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <h1>CSS Media Queries</h1>
  <div class="container">
    <div class="box">
      Box 1
    </div>
    <div class="box">
      Box 2
    </div>
    <div class="box">
      Box 3
    </div>
  </div>

</body>
</html>
