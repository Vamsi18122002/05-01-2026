<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: Arial; padding: 20px; }

.step { display: none; }
.step.active { display: block; }

input {
  display: block;
  margin: 10px 0;
  padding: 8px;
  width: 250px;
}

button {
  margin: 10px 5px;
  padding: 8px 12px;
}
</style>
</head>

<body>

<!-- Step 1 -->
<div class="step active" id="step1">
  <h3>Step 1: Basic Info</h3>
  <input type="text" id="name" placeholder="Name">
  <input type="email" id="email" placeholder="Email">
  <button onclick="next(1)">Next</button>
</div>

<!-- Step 2 -->
<div class="step" id="step2">
  <h3>Step 2: Address</h3>
  <input type="text" id="address" placeholder="Address">
  <input type="text" id="city" placeholder="City">
  <button onclick="prev(2)">Previous</button>
  <button onclick="next(2)">Next</button>
</div>

<!-- Step 3 -->
<div class="step" id="step3">
  <h3>Step 3: Review</h3>
  <p id="review"></p>
  <button onclick="prev(3)">Previous</button>
</div>

<script>
    function showStep(step) {
  document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
  document.getElementById("step" + step).classList.add("active");
}

function next(step) {
  // Validation
  if (step === 1) {
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    if (!name || !email) {
      alert("Please fill all fields");
      return;
    }
  }

  if (step === 2) {
    let address = document.getElementById("address").value;
    let city = document.getElementById("city").value;
    if (!address || !city) {
      alert("Please fill all fields");
      return;
    }

    // Show review
    document.getElementById("review").innerHTML =
      "Name: " + document.getElementById("name").value + "<br>" +
      "Email: " + document.getElementById("email").value + "<br>" +
      "Address: " + address + "<br>" +
      "City: " + city;
  }

  showStep(step + 1);
}

function prev(step) {
  showStep(step - 1);
}

</script>
</body>
</html>
