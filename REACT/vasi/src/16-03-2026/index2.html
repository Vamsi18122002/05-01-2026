<!DOCTYPE html>
<html>
<head>
<title>Student Registration</title>
<style>
body{
font-family: Arial;
background:#f2f2f2;
}
form{
width:350px;
margin:40px auto;
padding:20px;
background:white;
border-radius:10px;
box-shadow:0 0 10px gray;
}
h2{
text-align:center;
}
label{
font-weight:bold;
}
input{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:5px;
border:1px solid #ccc;
border-radius:5px;
}
button{
width:100%;
padding:10px;
background:#4CAF50;
color:white;
border:none;
border-radius:5px;
font-size:16px;
margin-top:10px;
cursor:pointer;
}
button:hover{
background:#45a049;
}
.error{
color:red;
font-size:12px;
margin-bottom:10px;
}
</style>
</head>

<body>
<form id="regForm">
<h2>Student Registration</h2>

<label>Name</label>
<input type="text" id="name">
<div class="error" id="nameError"></div>

<label>Email</label>
<input type="email" id="email">
<div class="error" id="emailError"></div>

<label>Course</label>
<input type="text" id="course">
<div class="error" id="courseError"></div>

<label>Password</label>
<input type="password" id="password">
<div class="error" id="passwordError"></div>

<label>Confirm Password</label>
<input type="password" id="confirmPassword">
<div class="error" id="confirmError"></div>

<button type="submit">Register</button>

</form>

<script src="./index.js">

</script>

</body>
</html>
