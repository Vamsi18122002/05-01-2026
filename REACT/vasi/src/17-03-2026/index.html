<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Listing</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>

<header>
  <div>MyShop</div>
  <div>
    <span class="toggle-btn" onclick="toggleSidebar()">Filters</span>
    🛒
  </div>
</header>

<div class="container">
  <aside class="sidebar" id="sidebar">
    <h3>Filters</h3>

    <h4>Price</h4>
    <input type="range" min="0" max="1000" />

    <h4>Category</h4>
    <label><input type="checkbox"> Electronics</label><br>
    <label><input type="checkbox"> Clothing</label><br>

    <h4>Rating</h4>
    <select>
      <option>4★ & above</option>
      <option>3★ & above</option>
    </select>
  </aside>

  <main class="products">
    <script>
      const products = Array.from({ length: 8 }).map((_, i) => ({
        title: `Product ${i + 1}`,
        price: `$${(i + 1) * 10}`,
        rating: (Math.random() * 5).toFixed(1),
        image: 'https://via.placeholder.com/200'
      }));

      document.write(products.map(p => `
        <div class="card">
          <img src="${p.image}" />
          <h4>${p.title}</h4>
          <p>${p.price}</p>
          <p>⭐ ${p.rating}</p>
          <button>Add to Cart</button>
        </div>
      `).join(''));

      function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
      }
    </script>
  </main>
</div>

</body>
</html>
