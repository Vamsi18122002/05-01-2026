<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Listing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial;background:#f4f4f4;}
header{
display:flex;
justify-content:space-between;
padding:15px;
background:#333;
color:#fff;
}
.container{display:flex;}
.sidebar{
width:220px;
background:#fff;
padding:15px;
}
.main{flex:1;padding:15px;}
.products{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}
.card{
background:#fff;
padding:10px;
text-align:center;
border-radius:5px;
}
.card img{
width:100%;
height:120px;
object-fit:cover;
}
button{
padding:8px;
margin-top:8px;
background:green;
color:#fff;
border:none;
cursor:pointer;
}

/* Tablet */
@media(max-width:992px){
.sidebar{display:none;}
.products{grid-template-columns:repeat(2,1fr);}
}

/* Mobile */
@media(max-width:600px){
.products{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<header>
<h2>Shop</h2>
<h2>🛒</h2>
</header>
<div class="container">
<div class="sidebar">
<h3>Filters</h3>
<p>Price</p>
<p><input type="checkbox"> Shoes</p>
<p><input type="checkbox"> Watch</p>
<p>Rating ★★★★</p>
</div>
<div class="main">
<div class="products">
<div class="card"><img src="https://via.placeholder.com/150"><h4>Product 1</h4><p>$20</p><p>★★★★</p><button>Add</button></div>
<div class="card"><img src="https://via.placeholder.com/150"><h4>Product 2</h4><p>$25</p><p>★★★★</p><button>Add</button></div>
<div class="card"><img src="https://via.placeholder.com/150"><h4>Product 3</h4><p>$30</p><p>★★★★★</p><button>Add</button></div>
<div class="card"><img src="https://via.placeholder.com/150"><h4>Product 4</h4><p>$18</p><p>★★★</p><button>Add</button></div>
<div class="card"><img src="https://via.placeholder.com/150"><h4>Product 5</h4><p>$35</p><p>★★★★</p><button>Add</button></div>
<div class="card"><img src="https://via.placeholder.com/150"><h4>Product 6</h4><p>$28</p><p>★★★★★</p><button>Add</button></div>
<div class="card"><img src="https://via.placeholder.com/150"><h4>Product 7</h4><p>$22</p><p>★★★★</p><button>Add</button></div>
<div class="card"><img src="https://via.placeholder.com/150"><h4>Product 8</h4><p>$40</p><p>★★★★★</p><button>Add</button></div>
</div>
</div>
</div>
</body>
</html>
