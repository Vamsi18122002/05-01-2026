<!DOCTYPE html>
<html lang="en">

    <title>Document</title>
</head>
<body>
    <script>
function removeDeepDuplicates(arr) {
    const s = new Set();

    return arr.filter(item => {
        // Convert item into a unique string representation
        const serialized = JSON.stringify(sortKeys(item));

        if (s.has(serialized)) {
            return false;
        }
        s.add(serialized);
        return true;
    });
}
// Helper function to sort object keys recursively
function sortKeys(value) {
    if (Array.isArray(value)) {
        return value.map(sortKeys);
    }

    if (value !== null && typeof value === "object") {
        return Object.keys(value)
            .sort()
            .reduce((result, key) => {
                result[key] = sortKeys(value[key]);
                return result;
            }, {});
    }
    return value;
}
const data = [1, 2, 1, [1, 2], [1, 2],{ a: 1, b: 2 },{ b: 2, a: 1 }];

console.log(removeDeepDuplicates(data));
    </script>
</body>
