
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>
function throttle(fn, delay) {
  let lastCall = 0;

  return function (...args) {
    const now = Date.now();
  
    if (now - lastCall >= delay) { 
      lastCall = now;
      fn.apply(this, args);
    }
  };
}
</script>
</body>
</html>
