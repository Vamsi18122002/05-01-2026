<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>
    <style>
        .sheet {
            width: 250px;
            border: 1px solid black;
            padding: 10px;
        }
        .sheet img {
            width: 100%;
            height: 150px;
        }
        .sheet h2 {
            margin: 10px 0;
        }
        .sheet p {
            font-size: 14px;
        }
        .sheet button {
            padding: 5px 10px;
        }
    </style>
</head>
<body>
<div class="sheet">

    <img src="./favicon.png" alt="Image">
    <h2>Product Title</h2>
    <p>This is a simple product description.</p>
    <button>Buy Now</button>

</div>
</body>
</html>
