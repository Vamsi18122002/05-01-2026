<!DOCTYPE html>
<html>
<head>
    <title>Navigation-Bar</title>
    <style>
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: lightgray;
            padding: 10px;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
        }
        .menu a {
            margin-left: 15px;
            text-decoration: none;
            color: black;
        }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo">
        Logo
    </div>
    <div class="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>
</div>
</body>
</html>
