<!DOCTYPE html>
<html>
<head>
    <title>Product Table</title>
</head>
<body>
<h2>Product Details</h2>
<table border="1" cellpadding="5" cellspacing="2">
    <thead>
        <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>Quantity</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Pen</td>
            <td>20</td>
            <td>3</td>
        </tr>
        <tr>
            <td>Notebook</td>
            <td>30</td>
            <td>4</td>
        </tr>
        <tr>
            <td>Pencil</td>
            <td>40</td>
            <td>5</td>
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <th>Total</th>
            <th>380</th>
            <th>12</th>
        </tr>
    </tfoot>
</table>
</body>
</html>
